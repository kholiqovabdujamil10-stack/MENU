{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food House</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav>
        <h2 class="logo">FOOD HOUSE</h2>
        <div class="links">
            <a href="http://127.0.0.1:8000/">HOME</a>
            <a href="http://127.0.0.1:8000/menu/">MENU</a>
            <a href="http://127.0.0.1:8000/popular/">POPULAR</a>
            <a href="http://127.0.0.1:8000/about/">ABOUT</a>
            <a href="http://127.0.0.1:8000/contact/">CONTACT</a>
        </div>
    </nav>

    <main>
        <h1>Our <span>Menu</span> 🍽️</h1>

        <div class="food-container">

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">
                <h2>Classic Burger</h2>
                <p>Juicy beef, cheese and fresh vegetables.</p>
                <h3>$8.99</h3>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?w=500">
                <h2>Italian Pizza</h2>
                <p>Fresh pizza with cheese and tomatoes.</p>
                <h3>$12.99</h3>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1559847844-5315695dadae?w=500">
                <h2>French Fries</h2>
                <p>Crispy golden potatoes.</p>
                <h3>$4.99</h3>
            </div>

        </div>

        <a class="btn" href="http://127.0.0.1:8000/">BACK HOME</a>
    </main>

</body>
</html>
